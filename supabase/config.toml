# Project configuration for Supabase CLI (PEDIDOS - WSN-GD-v2)
project_id = "pedidos-medios"

[api]
enabled = true
port = 54351
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54352
shadow_port = 54350
major_version = 17

[db.pooler]
enabled = false
port = 54359

[studio]
enabled = true
port = 54353

[local_smtp]
enabled = true
port = 54354

[auth]
enabled = true
site_url = "https://formulariomedios.pages.dev"
additional_redirect_urls = [
  "https://formulariomedios.pages.dev/confirmar-email",
  "https://formulariomedios.pages.dev/mis-solicitudes",
  "https://formulariomedios.pages.dev/login",
  "https://formulariomedios.pages.dev/gestion"
]
jwt_expiry = 3600
enable_signup = true

[auth.email.template.confirmation]
subject = "[PEDIDOS] Solicitud de acceso recibida — Verificación de correo"
content_path = "./supabase/templates/confirmation.html"

[storage]
enabled = false

[edge_runtime]
enabled = true
port = 54355

[analytics]
enabled = false
port = 54357

[functions.submission-session-prepare]
verify_jwt = false

[functions.drive-upload-prepare]
verify_jwt = false

[functions.drive-upload-complete]
verify_jwt = false

[functions.submission-create]
verify_jwt = false

[functions.drive-download]
verify_jwt = true

[functions.tracking-get]
verify_jwt = false

[functions.tracking-recover]
verify_jwt = false

[functions.info-token-validate]
verify_jwt = false

[functions.info-response-submit]
verify_jwt = false

[functions.tracking-exchange]
verify_jwt = false

[functions.solicitante-access-request]
verify_jwt = false

[functions.solicitante-session-exchange]
verify_jwt = false

[functions.solicitante-pedidos-list]
verify_jwt = false

[functions.solicitante-pedido-detail]
verify_jwt = false

[functions.solicitante-info-respond]
verify_jwt = false

[functions.solicitante-session-revoke]
verify_jwt = false

[functions.comunicaciones-dispatch]
verify_jwt = false

[functions.info-request-create]
verify_jwt = false

[functions.admin-user-delete]
verify_jwt = false
